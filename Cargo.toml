[package]
name = "antigravity-proxy-rust"
version = "2.3.0"
edition = "2024"

[lib]
name = "antigravity_proxy_rust"
path = "src/lib.rs"

[[bin]]
name = "antigravity-proxy-rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.7.5", default-features = false, features = ["http1", "http2", "json", "macros", "matched-path", "query", "tokio"] }
axum-extra = { version = "0.9.2", features = ["cookie"] }
reqwest = { version = "0.12.5", default-features = false, features = ["json", "stream", "native-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5.2", features = ["cors", "fs", "trace"] }
futures = "0.3.30"
tokio-stream = { version = "0.1.15", features = ["sync"] }
rand = "0.8.5"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde", "std"] }
sha2 = "0.10.8"
base64 = "0.22.1"
once_cell = "1.19.0"
cookie = "0.18.0"
hex = "0.4.3"
urlencoding = "2.1.3"
bytes = "1.6.0"
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

